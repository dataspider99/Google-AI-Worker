# Nginx configuration for Johny Sins at jsins.oshaani.com (HTTP only – use before SSL certs exist)
# App runs on 127.0.0.1:8002.
# After this is active, run: sudo certbot --nginx -d jsins.oshaani.com
# Then replace this file with jsins.oshaani.com.conf for full HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name jsins.oshaani.com;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8002/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
